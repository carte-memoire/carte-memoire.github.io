# =====================================================================
# Carte Mémoire · Publication du site sur GitHub Pages
#
# À chaque envoi sur main (ou à la demande, onglet Actions → « Run workflow ») :
#   1. les tests de la base (migrations, règles de sécurité) doivent passer ;
#   2. le site est compilé avec l'adresse et la clé PUBLIQUE de Supabase,
#      lues dans les variables du dépôt (Settings → Secrets and variables →
#      Actions → Variables) : VITE_SUPABASE_URL et VITE_SUPABASE_PUBLISHABLE_KEY
#      (rangées par erreur dans « Secrets », elles sont lues aussi), et l'adresse de
#      contact des pages légales : VITE_CONTACT_EMAIL ;
#   3. une page HTML par jeu est générée pour les moteurs de recherche, avec le plan
#      du site (web/scripts/prerender.mjs) ; si cette étape échoue, le site est
#      publié quand même, sans elles ;
#   4. il est publié sur https://carte-memoire.app (nom de domaine réglé dans
#      Settings → Pages ; l'ancienne adresse carte-memoire.github.io y renvoie).
#      Variable SITE_URL pour en changer.
# Chaque nuit aussi, pour que les nouveaux jeux et jaquettes arrivent dans Google.
# =====================================================================

name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Chaque nuit (3 h 17 UTC) : fiches des jeux à jour pour les moteurs de recherche
  schedule:
    - cron: '17 3 * * *'

# Par défaut, rien d'autre que la lecture du code
permissions:
  contents: read

# Une seule publication à la fois ; celle en cours va jusqu'au bout
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  tests:
    name: Tests de la base
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: supabase/tests/package-lock.json
      - name: Installer
        working-directory: supabase/tests
        run: npm ci
      - name: Lancer les tests
        working-directory: supabase/tests
        run: npm test

  build:
    name: Compiler le site
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Garde-fou : le site part chez tous les visiteurs, la clé doit être la clé PUBLIQUE.
      # Espaces, guillemets et « / » final recopiés par mégarde sont retirés ; les valeurs
      # nettoyées servent ensuite à la compilation.
      - name: Vérifier les réglages
        env:
          RAW_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          RAW_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          url=$(printf '%s' "$RAW_URL" | tr -d '[:space:]"' | sed 's#/*$##')
          key=$(printf '%s' "$RAW_KEY" | tr -d '[:space:]"')
          where="Settings → Secrets and variables → Actions → onglet Variables"
          [ -n "$url" ] || { echo "::error::Variable VITE_SUPABASE_URL absente : crée-la dans $where"; exit 1; }
          [ -n "$key" ] || { echo "::error::Variable VITE_SUPABASE_PUBLISHABLE_KEY absente : crée-la dans $where"; exit 1; }
          case "$url" in
            https://*.supabase.co) ;;
            *) echo "::error::VITE_SUPABASE_URL vaut « $url » : attendu https://xxxx.supabase.co"; exit 1 ;;
          esac
          case "$key" in
            sb_publishable_*) ;;
            *) echo "::error::VITE_SUPABASE_PUBLISHABLE_KEY doit être la clé PUBLIQUE (sb_publishable_…), jamais la clé secrète"; exit 1 ;;
          esac
          echo "VITE_SUPABASE_URL=$url" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$key" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Installer
        working-directory: web
        run: npm ci
      # 404.html = index.html : une adresse comme /jeu/42 ouverte directement charge
      # quand même le site, qui affiche la bonne page
      - name: Compiler
        working-directory: web
        env:
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
        run: |
          npm run build
          cp dist/index.html dist/404.html
      # Référencement : une page par jeu, sitemap.xml, robots.txt. En cas d'échec, simple
      # avertissement : le site part tel qu'il a été compilé juste au-dessus.
      - name: Générer les fiches pour les moteurs de recherche
        working-directory: web
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://carte-memoire.app' }}
        run: |
          node scripts/prerender.mjs || echo "::warning::Fiches pour les moteurs de recherche non générées, le site est publié sans elles"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    name: Publier
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
